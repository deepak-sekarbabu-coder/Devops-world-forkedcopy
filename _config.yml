theme: jekyll-theme-minimal

title: Devops World
description: A DevOps repository

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed

# Site configuration
show_downloads: true

# Liquid configuration - prevent processing of template syntax in code blocks
liquid:
  error_mode: strict

# Exclude files from build
exclude:
  - CONTRIBUTING.md
  - LICENSE.md
  - README.md
