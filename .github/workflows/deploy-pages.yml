name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install MkDocs
        run: python -m pip install mkdocs

      - name: Build site
        # This repo publishes its own root (docs_dir: .), which MkDocs refuses
        # when the config file lives there. Same workaround as serve.py: build
        # from a temp config that points docs_dir at the absolute workspace.
        # site_dir stays relative, so output lands in $RUNNER_TEMP/site,
        # outside docs_dir.
        #
        # --strict makes link warnings build failures, so a broken internal
        # link fails CI instead of shipping. Fix the link; don't remove the flag.
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          src = Path("mkdocs.yml").read_text(encoding="utf-8").replace(
              "docs_dir: .", f"docs_dir: {Path.cwd().as_posix()}"
          )
          out = Path(os.environ["RUNNER_TEMP"]) / "mkdocs-ci.yml"
          out.write_text(src, encoding="utf-8")
          PY
          python -m mkdocs build --strict -f "$RUNNER_TEMP/mkdocs-ci.yml"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
